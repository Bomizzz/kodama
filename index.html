<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodama · Acceso</title>
<style>
:root{color-scheme:light;--ink:#172b25;--muted:#4a6258;--pine:#123d32;--paper:#f5f7f3;--line:#aabbb2;--accent:#25674f}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:clamp(16px,4vw,64px)}
main{isolation:isolate;width:min(100%,1060px);min-height:575px;display:grid;grid-template-columns:1.05fr 1fr;background:#fff;border:1px solid #dbe4dc;border-radius:28px;overflow:hidden;box-shadow:0 24px 80px #19392d17}
header{position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 90% 86%,#397b5e 0%,transparent 58%),linear-gradient(150deg,#102d26,#153e33 62%,#1c5747);color:#f5f8ef;padding:clamp(32px,6vw,72px);display:flex;flex-direction:column;justify-content:center}
header::before,header::after{content:"";position:absolute;z-index:-1;right:-210px;bottom:-345px;width:660px;aspect-ratio:1;border-radius:45% 55% 62% 38%;transform:rotate(-26deg);border:1px solid #cae4ba4a;box-shadow:0 0 0 22px #d1e5c319,0 0 0 45px #d1e5c319,0 0 0 70px #d1e5c319,0 0 0 98px #d1e5c319,0 0 0 130px #d1e5c319}
header::after{right:-390px;bottom:25px;transform:rotate(16deg);opacity:.55}
.brand{font-size:clamp(54px,8vw,102px);line-height:1;letter-spacing:-.08em;margin:0;font-weight:730}
#mode{align-self:flex-start;margin:24px 0 0;padding:5px 12px;border:1px solid #d8edcf70;border-radius:999px;font-size:.82rem}
.content{align-self:center;padding:clamp(25px,5.7vw,66px);min-width:0}
h2{margin:0 0 20px;font-size:clamp(25px,3.5vw,38px);letter-spacing:-.045em;line-height:1.15}
h3{margin:24px 0 6px}label{display:block;font-weight:650;margin:16px 0;font-size:.94rem}
input,button{width:100%;border-radius:11px;font:inherit;padding:12px 14px;min-height:48px}
input{display:block;margin-top:6px;border:1px solid var(--line);background:#fcfdfa;color:var(--ink)}
button{background:var(--accent);color:#fff;border:1px solid transparent;font-weight:700;cursor:pointer;margin:8px 0}
button:hover:enabled{background:var(--pine)} button:disabled{opacity:.55;cursor:wait}
:focus-visible{outline:3px solid #a27321;outline-offset:3px}
#examples{display:block;background:#edf4eb;color:var(--ink);border-radius:12px;padding:12px 14px;margin-top:15px}
#status{color:#8b2e32;margin:12px 0 0}#status:empty{display:none}
#identity{overflow-wrap:anywhere;color:var(--muted)} [hidden]{display:none!important}
@media(max-width:680px){main{grid-template-columns:1fr;min-height:0}header{min-height:190px}.content{padding:30px 24px}}
</style>
<main>
<header><h1 class="brand">Kodama</h1><p id="mode" hidden>Demostración local</p></header>
<section class="content">
<form id="login">
<h2>Iniciar sesión</h2>
<label>Correo electrónico<input name="email" type="email" required autocomplete="username"></label>
<label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label>
<button>Entrar</button>
<small id="examples" hidden>Administradora: admin@kodama.test<br>Usuario: usuario@kodama.test<br>Contraseña de ambos: <strong>1234</strong></small>
</form>
<section id="panel" hidden>
<h2 id="role"></h2>
<p id="identity"></p>
<form id="create" hidden>
<h3>Crear cuenta de usuario</h3>
<label>Correo del usuario<input name="email" type="email" required></label>
<label>Contraseña inicial<input name="password" type="password" required minlength="12" maxlength="72" autocomplete="new-password"></label>
<button>Crear usuario</button>
</form>
<form id="logout"><button>Cerrar sesión</button></form>
</section>
<p id="status" role="status"></p>
</section>
</main>
<script src="./config.js"></script>
<script>
const config = window.KODAMA_CONFIG;
const demo = config?.demo && ['file:', 'http:'].includes(location.protocol)
  && (location.protocol === 'file:' || ['localhost','127.0.0.1'].includes(location.hostname));
const login = document.querySelector('#login');
const panel = document.querySelector('#panel');
const create = document.querySelector('#create');
const status = document.querySelector('#status');
const examples = {
  'admin@kodama.test': 'admin',
  'usuario@kodama.test': 'user'
};
let client;
function show(email, role) {
  login.hidden = Boolean(role);
  panel.hidden = !role;
  create.hidden = role !== 'admin' || demo;
  document.querySelector('#role').textContent = role === 'admin' ? 'Panel de administración' : 'Mi cuenta';
  document.querySelector('#identity').textContent = email ?? '';
}
function submit(form, handler) {
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = form.querySelector('button');
    button.disabled = true;
    status.textContent = '';
    try { await handler(new FormData(form)); }
    catch (error) { status.textContent = error.message; }
    finally { button.disabled = false; }
  });
}
async function showSession(session) {
  if (!session) return show();
  const { data, error } = await client.from('kodama_profiles').select('role').eq('id', session.user.id).single();
  if (error || !['admin', 'user'].includes(data?.role)) {
    await client.signOut();
    throw new Error('Esta cuenta no tiene acceso a Kodama.');
  }
  show(session.user.email, data.role);
}
async function start() {
  if (demo) {
    document.querySelector('#mode').hidden = false;
    document.querySelector('#examples').hidden = false;
  } else {
    if (!config?.url || !config?.publishableKey) throw new Error('Falta configurar la conexión con Supabase.');
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.49.4');
    client = createClient(config.url, config.publishableKey);
    const { data, error } = await client.auth.getSession();
    if (error) throw new Error('No se pudo recuperar la sesión.');
    await showSession(data.session);
  }
  submit(login, async fields => {
    const email = String(fields.get('email')).trim().toLowerCase();
    const password = String(fields.get('password'));
    if (demo) {
      if (!Object.hasOwn(examples, email) || password !== '1234') throw new Error('Correo o contraseña incorrectos.');
      show(email, examples[email]);
    } else {
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) throw new Error('No se pudo iniciar sesión. Comprueba tus credenciales.');
      await showSession(data.session);
    }
    login.reset();
  });
  submit(document.querySelector('#logout'), async () => {
    if (!demo) {
      const { error } = await client.auth.signOut({scope:'local'});
      if (error) throw new Error('No se pudo cerrar la sesión. Inténtalo de nuevo.');
    }
    show();
  });
  submit(create, async fields => {
    if (demo) return;
    const { data, error } = await client.functions.invoke('kodama-create-user', {
      body: { email: fields.get('email'), password: fields.get('password') }
    });
    if (error || !data?.id) throw new Error('No se pudo crear la cuenta. Revisa el correo y la contraseña.');
    create.reset();
    status.textContent = 'Cuenta de usuario creada.';
  });
}
login.querySelector('button').disabled = true;
start().then(() => { login.querySelector('button').disabled = false; })
  .catch(error => { status.textContent = error.message; });
</script>
</html>
